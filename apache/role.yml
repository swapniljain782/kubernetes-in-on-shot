apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: apache
  name: apache-manager
rules:
- apiGroups: ["", "apps", "rbac.authorization.k8s.io", "batch"] # "" indicates the core API group
  resources: ["pods", "deployment", "service"]
  verbs: ["get", "watch", "list", "apply", "create", "patch"]
